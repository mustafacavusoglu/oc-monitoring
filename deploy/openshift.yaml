# Deploy into the existing mlops-development project:
#   oc apply -f deploy/openshift.yaml
# Every environment-specific value lives in the ConfigMap below; the binary has
# no built-in defaults and refuses to start if a key is missing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-dashboard-config
  namespace: mlops-development
data:
  HTTP_ADDR: ":8080"
  WEB_DIR: /app/web
  UI_REFRESH_INTERVAL: 30s
  UPSTREAM_TIMEOUT: 10s

  # Batch projects: namespaces come from the project JSON in Azure Repos.
  AZURE_REPO_URL: https://dev.azure.com/ORG/PROJECT/_git/REPOSITORY
  AZURE_REPO_BRANCH: main
  AZURE_PROJECTS_PATH: /path/to/project.json
  BATCH_SERVING_KEYWORD: bch
  # Projects whose `Type` equals this value are shown under Custom Serve.
  CUSTOM_SERVE_TYPE: CustomServe
  PROJECT_REFRESH_INTERVAL: 5m

  # Batch image checks against Nexus. {namespace} and {imageId} are filled per image.
  NEXUS_MANIFEST_URL_TEMPLATE: https://repomaster.company.com/repository/company-private/v2/mlops/bch-{namespace}/manifests/{imageId}
  IMAGE_CACHE_TTL: 24h
  REGISTRY_CHECK_CONCURRENCY: "4"

  # Online models: InferenceServices are classified by their ServingRuntime image.
  LLM_RUNTIME_IMAGE_KEYWORDS: vllm
  ML_RUNTIME_IMAGE_KEYWORDS: triton
  GPU_RESOURCE_NAME: nvidia.com/gpu
  # MIG slices (mixed strategy), e.g. nvidia.com/mig-1g.5gb; the suffix is the profile.
  MIG_RESOURCE_PREFIX: nvidia.com/mig-

  # Watched APIs (group/version/resource), adjustable per cluster version.
  CRONWORKFLOW_RESOURCE: argoproj.io/v1alpha1/cronworkflows
  WORKFLOW_RESOURCE: argoproj.io/v1alpha1/workflows
  INFERENCE_SERVICE_RESOURCE: serving.kserve.io/v1beta1/inferenceservices
  SERVING_RUNTIME_RESOURCE: serving.kserve.io/v1alpha1/servingruntimes
  LLM_INFERENCE_SERVICE_RESOURCE: serving.kserve.io/v1alpha1/llminferenceservices
---
# Azure Repos PAT used to read the project JSON. Replace the placeholder
# locally before `oc apply`; never commit a real token. Re-applying this file
# overwrites the value in the cluster with what is written here.
apiVersion: v1
kind: Secret
metadata:
  name: mlops-dashboard-secrets
  namespace: mlops-development
type: Opaque
stringData:
  AZURE_TOKEN: "<AZURE_PAT>"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-dashboard
  namespace: mlops-development
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mlops-dashboard-reader
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - cronworkflows
      - workflows
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
      - servingruntimes
      - llminferenceservices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mlops-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: mlops-dashboard
    namespace: mlops-development
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlops-dashboard-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-dashboard
  namespace: mlops-development
  labels:
    app.kubernetes.io/name: mlops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-dashboard
    spec:
      serviceAccountName: mlops-dashboard
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: mustafa12/monitor:0.0.25
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mlops-dashboard-config
            - secretRef:
                name: mlops-dashboard-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-dashboard
  namespace: mlops-development
spec:
  selector:
    app.kubernetes.io/name: mlops-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mlops-dashboard
  namespace: mlops-development
spec:
  to:
    kind: Service
    name: mlops-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
