apiVersion: v1
kind: Namespace
metadata:
  name: workflow-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronworkflow-dashboard
  namespace: workflow-monitoring
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cronworkflow-dashboard-reader
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - cronworkflows
      - workflows
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cronworkflow-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: cronworkflow-dashboard
    namespace: workflow-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cronworkflow-dashboard-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronworkflow-dashboard
  namespace: workflow-monitoring
  labels:
    app.kubernetes.io/name: cronworkflow-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cronworkflow-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronworkflow-dashboard
    spec:
      serviceAccountName: cronworkflow-dashboard
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/workflow-monitoring/cronworkflow-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AZURE_REPO_URL
              value: https://dev.azure.com/ORG/PROJECT/_git/REPOSITORY
            - name: AZURE_REPO_BRANCH
              value: main
            - name: AZURE_PROJECTS_PATH
              value: /path/to/project.json
            - name: PROJECT_REFRESH_INTERVAL
              value: 5m
            - name: IMAGE_CACHE_TTL
              value: 5m
            - name: REGISTRY_CHECK_CONCURRENCY
              value: "4"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: azure-token
              mountPath: /var/run/azure
              readOnly: true
            - name: registry-auth
              mountPath: /var/run/registry
              readOnly: true
      volumes:
        - name: azure-token
          secret:
            secretName: cronworkflow-azure-token
            optional: true
            items:
              - key: token
                path: token
        - name: registry-auth
          secret:
            secretName: cronworkflow-registry-auth
            optional: true
            items:
              - key: config.json
                path: config.json
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cronworkflow-dashboard
  namespace: workflow-monitoring
spec:
  selector:
    app.kubernetes.io/name: cronworkflow-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cronworkflow-dashboard
  namespace: workflow-monitoring
spec:
  to:
    kind: Service
    name: cronworkflow-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
