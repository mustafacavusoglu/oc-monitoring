apiVersion: v1
kind: Namespace
metadata:
  name: workflow-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cronworkflow-dashboard-config
  namespace: workflow-monitoring
data:
  HTTP_ADDR: ":8080"
  WEB_DIR: /app/web
  AZURE_REPO_URL: https://dev.azure.com/ORG/PROJECT/_git/REPOSITORY
  AZURE_REPO_BRANCH: main
  AZURE_PROJECTS_PATH: /path/to/project.json
  PROJECT_REFRESH_INTERVAL: 5m
  IMAGE_CACHE_TTL: 5m
  REGISTRY_CHECK_CONCURRENCY: "4"
  NEXUS_URL: https://repomaster.company.com/repository/company-private/v2/mlops/
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronworkflow-dashboard
  namespace: workflow-monitoring
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cronworkflow-dashboard-reader
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - cronworkflows
      - workflows
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cronworkflow-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: cronworkflow-dashboard
    namespace: workflow-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cronworkflow-dashboard-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronworkflow-dashboard
  namespace: workflow-monitoring
  labels:
    app.kubernetes.io/name: cronworkflow-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cronworkflow-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronworkflow-dashboard
    spec:
      serviceAccountName: cronworkflow-dashboard
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: mustafa12/monitor:0.0.17
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cronworkflow-dashboard-config
            - secretRef:
                name: cronworkflow-dashboard-secrets
                optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cronworkflow-dashboard
  namespace: workflow-monitoring
spec:
  selector:
    app.kubernetes.io/name: cronworkflow-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cronworkflow-dashboard
  namespace: workflow-monitoring
spec:
  to:
    kind: Service
    name: cronworkflow-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
